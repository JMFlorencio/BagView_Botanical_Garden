<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAGVIEW | AR Eco-Tourism</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        @font-face { font-family: 'Agrandir'; src: url('./Assets/agrandir-thin.woff2') format('woff2'); font-weight: 100; font-style: normal; }
        @font-face { font-family: 'Agrandir'; src: url('./Assets/agrandir-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
        
        :root { 
            --accent: #00A699; 
            --accent-soft: rgba(0, 166, 153, 0.2);
            --transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            --safe-bottom: env(safe-area-inset-bottom, 0px); 
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Agrandir', sans-serif !important; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
        
        /* --- AR SCANNER UI --- */
        #ar-reticle { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 80vw; height: 45vh; z-index: 4000; pointer-events: none; opacity: 0; transition: 0.5s var(--transition); }
        .leaf-corner { position: absolute; width: 60px; height: 60px; border: 4px solid var(--accent); }
        .top-left { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 40px 0 0 0; }
        .top-right { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 40px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 40px; }
        .bottom-right { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 40px 0; }
        .laser-line { position: absolute; width: 100%; height: 2px; background: linear-gradient(to right, transparent, var(--accent), transparent); top: 0; animation: scanMove 4s linear infinite; }
        @keyframes scanMove { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #ar-top-layer { position: fixed; top: 40px; left: 20px; right: 20px; z-index: 4500; display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; pointer-events: none; transition: 0.3s; opacity: 0; }
        .ar-home-btn { pointer-events: auto; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .status-badge { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 50px; color: white; font-size: 11px; font-weight: 800; text-transform: uppercase; pointer-events: auto; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

        /* --- GALLERY DOCK --- */
        #gallery-dock-container { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4600; background: rgba(255,255,255,0.95); border-top-left-radius: 35px; border-top-right-radius: 35px; display: flex; flex-direction: column; align-items: center; padding-bottom: calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.6s var(--transition), opacity 0.4s ease; opacity: 0; }
        #gallery-dock-container.ar-active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .dock-handle-area { width: 100%; padding: 15px 0; display: flex; justify-content: center; touch-action: none; cursor: grab; }
        .dock-handle { width: 50px; height: 4px; background: #e0e0e0; border-radius: 10px; }
        #gallery-dock { display: flex; gap: 15px; overflow-x: auto; padding: 10px 25px 15px; width: 100%; scrollbar-width: none; }
        .gallery-item { flex: 0 0 100px; text-align: center; }
        .gallery-img-wrap { width: 100px; height: 100px; border-radius: 20px; overflow: hidden; border: 1px solid #eee; margin-bottom: 8px; position: relative; background: #f9f9f9; }
        .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-item span { font-size: 9px; font-weight: 800; text-transform: uppercase; color: #444; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- ORIGINAL PAGES & HERO --- */
        .overlay-screen { position: fixed; inset: 0; z-index: 1000; background: #fff; transition: 0.4s; overflow-y: auto; padding-bottom: 140px; }
        .hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(20px); }
        .user-greeting { padding: 45px 25px 10px; }
        .user-greeting h2 { margin: 0; font-size: 26px; font-weight: 900; color: #333; }

        .hero-slider-container { margin: 15px 25px; height: 190px; border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(0,166,153,0.25); }
        .promo-banner { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--accent); color: white; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 30px; opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 1; }
        .promo-banner.active { opacity: 1; z-index: 2; }
        .promo-banner h1 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.2; }
        .promo-banner button { background: white; color: var(--accent); border: none; padding: 10px 20px; border-radius: 50px; font-weight: 900; margin-top: 15px; font-size: 10px; text-transform: uppercase; }

        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; }
        .section-header h4 { margin: 0; font-size: 16px; font-weight: 900; color: #222; }
        .scans-info { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; }

        /* --- EXIT BUTTON (TOP RIGHT) --- */
        #tour-back-btn { position: fixed; top: 30px; right: 20px; z-index: 9999; display: none; }
        #tour-back-btn button { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 50px; font-weight: 900; font-size: 11px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; flex-direction: row-reverse; }

        /* --- LOADING EXPERIENCE --- */
        #tour-modal { position: fixed; inset: 0; z-index: 9000; background: #111; transform: translateY(100%); transition: 0.5s; }
        #tour-modal.visible { transform: translateY(0); }
        #tour-loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; background: #111; z-index: 9001; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-navigation-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(90px + var(--safe-bottom)); background: #fff; z-index: 5000; display: flex; justify-content: space-around; align-items: center; padding: 0 15px var(--safe-bottom); box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .nav-item-center { width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -45px; border: 6px solid #fff; }

        a-scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    </style>
</head>
<body>
    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="tour-back-btn">
        <button onclick="app.closeInternalPage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            Exit Experience
        </button>
    </div>

    <div id="ar-reticle">
        <div class="leaf-corner top-left"></div><div class="leaf-corner top-right"></div>
        <div class="leaf-corner bottom-left"></div><div class="leaf-corner bottom-right"></div>
        <div class="laser-line"></div>
    </div>
    
    <div id="ar-top-layer">
        <div class="ar-home-btn" onclick="app.nav('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div><span id="status-text">Scanning...</span>
        </div>
    </div>

    <div id="gallery-dock-container">
        <div class="dock-handle-area" id="dock-drag-handle"><div class="dock-handle"></div></div>
        <div id="gallery-dock"></div>
    </div>

    <div id="home-page" class="overlay-screen">
        <div class="user-greeting"><h3>Hi, Explorer!</h3><h2>Let’s Discover Baguio</h2></div>
        
        <div class="hero-slider-container">
            <div class="hero-wrapper" id="hero-wrapper">
                <div class="promo-banner active"><h1>Discover Hidden Eco-Trails</h1><button onclick="app.startScanner()">Explore Now</button></div>
                <div class="promo-banner" style="background: #008f84"><h1>Unlock 3D Plant Models</h1><button onclick="app.startScanner()">Scan Marker</button></div>
                <div class="promo-banner" style="background: #007a71"><h1>Virtual Heritage Tours</h1><button onclick="app.startScanner()">Find Marker</button></div>
            </div>
        </div>

        <div class="section-header"><h4>Most Scanned Station</h4></div>
        <div id="most-scanned-list" style="display:flex; gap:15px; overflow-x:auto; padding:0 25px 30px; scrollbar-width:none;"></div>
    </div>

    <nav class="main-navigation-bar" id="main-nav">
        <div class="nav-item active" onclick="app.nav('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
        <div class="nav-item-center" onclick="app.startScanner()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="9" y="9" width="6" height="6"></rect></svg>
        </div>
        <div class="nav-item" onclick="app.resetApp()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></div>
    </nav>

    <div id="tour-modal">
        <div id="tour-loader">
            <div class="spinner"></div>
            <span style="font-size: 10px; font-weight: 800; letter-spacing: 2px;">LOADING EXPERIENCE...</span>
        </div>
        <iframe id="tour-iframe" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" embedded vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

<script>
const app = {
    currentHero: 0,
    dockState: { startY: 0, currentY: 0, isDragging: false, isOpen: true },
    stations: [
        { id: 0, name: "Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/Interactive_Map/", scans: 1240 },
        { id: 1, name: "Main Entrance", thumb: "Assets/A2_Main Entrance.png", link: "https://tour.panoee.net/mainentrance/1", scans: 980 },
        { id: 2, name: "Arbor", thumb: "Assets/Arbor.png", link: "https://tour.panoee.net/arbor", scans: 340 },
        { id: 3, name: "Asian Garden", thumb: "Assets/Asian Garden.png", link: "https://tour.panoee.net/asian-garden", scans: 450 },
        { id: 4, name: "Cactus & Succulents", thumb: "Assets/Cactus&Succulents.png", link: "https://tour.panoee.net/cactus-succulent-garden/1-1", scans: 640 },
        { id: 5, name: "Centennial Garden", thumb: "Assets/Centennial Garden.png", link: "https://tour.panoee.net/centennial-garden/1", scans: 210 },
        { id: 6, name: "Chinese Garden", thumb: "Assets/Chinese%20Garden.png", link: "https://tour.panoee.net/chinese-garden/69cd28ffcd728200084a2654", scans: 520 },
        { id: 7, name: "City of Vaughan", thumb: "Assets/City%20of%20Vaughan%20Friendship%20Garden.png", link: "https://tour.panoee.net/city-of-vaughan", scans: 180 },
        { id: 8, name: "Cordillera Village", thumb: "Assets/Cordillera%20Village.png", link: "https://tour.panoee.net/cordillera-village/1", scans: 890 },
        { id: 9, name: "Dahlia Garden", thumb: "Assets/Dahlia Garden.png", link: "https://tour.panoee.net/69b74a8ccd5918bff013a943", scans: 310 },
        { id: 10, name: "Greenhouse", thumb: "Assets/Greenhouse.png", link: "https://tour.panoee.net/greenhouse/1", scans: 420 },
        { id: 11, name: "Japanese Garden", thumb: "Assets/Japanese%20Garden.png", link: "https://tour.panoee.net/japanese-garden", scans: 760 },
        { id: 12, name: "Japanese Tunnel", thumb: "Assets/Japanese%20Tunnel.png", link: "https://tour.panoee.net/japanese-tunnel/1", scans: 1120 },
        { id: 13, name: "Korea Garden", thumb: "Assets/Korea%20Garden.png", link: "https://tour.panoee.net/korea-garden/1", scans: 580 },
        { id: 14, name: "Orchidarium", thumb: "Assets/Orchidarium.png", link: "https://tour.panoee.net/orchidarium/1", scans: 390 },
        { id: 15, name: "Friendship Garden", thumb: "Assets/Philippine-Thailand Frienship Garden.png", link: "https://tour.panoee.net/philippine-thailand-friendship-garden/7-1", scans: 270 },
        { id: 16, name: "PMSEA Garden", thumb: "Assets/PMSEA%20Garden.png", link: "https://tour.panoee.net/pmsea-garden", scans: 150 }
    ],

    init: function() {
        this.renderMostScanned(); this.renderDock(); this.initAR(); this.initDockDraggable(); this.startHeroSlider();
        document.getElementById('tour-iframe').onload = () => {
            document.getElementById('tour-loader').style.opacity = '0';
            setTimeout(() => { document.getElementById('tour-loader').style.display = 'none'; }, 500);
        };
    },

    initDockDraggable: function() {
        const dock = document.getElementById('gallery-dock-container');
        const handle = document.getElementById('dock-drag-handle');
        handle.addEventListener('touchstart', (e) => { this.dockState.startY = e.touches[0].clientY; this.dockState.isDragging = true; dock.style.transition = 'none'; });
        window.addEventListener('touchmove', (e) => {
            if (!this.dockState.isDragging) return;
            let moveY = e.touches[0].clientY - this.dockState.startY;
            if (this.dockState.isOpen && moveY > 0) { this.dockState.currentY = moveY; dock.style.transform = `translateY(${moveY}px)`; } 
        });
        window.addEventListener('touchend', () => {
            if (!this.dockState.isDragging) return;
            this.dockState.isDragging = false;
            dock.style.transition = 'transform 0.5s var(--transition)';
            if (this.dockState.currentY > 60) { dock.style.transform = 'translateY(calc(100% - 45px))'; this.dockState.isOpen = false; } 
            else { dock.style.transform = 'translateY(0)'; }
            this.dockState.currentY = 0;
        });
    },

    renderMostScanned: function() {
        const list = document.getElementById('most-scanned-list');
        const top = [...this.stations].sort((a,b) => b.scans - a.scans).slice(0, 5);
        list.innerHTML = top.map(s => `
            <div style="flex:0 0 200px; background:white; border-radius:25px; padding:12px; box-shadow:var(--card-shadow);">
                <img src="${s.thumb}" style="width:100%; height:120px; border-radius:18px; object-fit:cover;">
                <b style="font-size:14px; display:block; margin-top:10px;">${s.name}</b>
                <div class="scans-info"><span>${s.scans} SCANS</span></div>
            </div>`).join('');
    },

    renderDock: function() {
        const dock = document.getElementById('gallery-dock');
        dock.innerHTML = this.stations.map(s => `
            <div class="gallery-item" onclick="app.openInternalPage('${s.link}', ${s.id})">
                <div class="gallery-img-wrap"><img src="${s.thumb}"></div>
                <span>${s.name}</span>
            </div>`).join('');
    },

    startScanner: function() {
        document.querySelectorAll('.overlay-screen').forEach(p => p.classList.add('hidden'));
        document.getElementById('main-nav').style.transform = "translateY(150%)";
        document.getElementById('ar-top-layer').style.opacity = "1";
        document.getElementById('ar-reticle').style.opacity = "1";
        document.getElementById('gallery-dock-container').classList.add('ar-active');
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].start();
    },

    initAR: function() {
        const container = document.getElementById('target-container');
        const matchSound = document.getElementById('match-sound');
        this.stations.forEach(s => {
            const entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', `targetIndex: ${s.id}`);
            entity.addEventListener("targetFound", () => {
                matchSound.play();
                document.getElementById('status-text').innerText = "Match Found!";
                setTimeout(() => this.openInternalPage(s.link, s.id), 800);
            });
            container.appendChild(entity);
        });
    },

    openInternalPage: function(url, stationId) { 
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].stop();
        document.getElementById('tour-loader').style.display = 'flex';
        document.getElementById('tour-loader').style.opacity = '1';
        document.getElementById('tour-iframe').src = url; 
        document.getElementById('tour-modal').classList.add('visible'); 
        document.getElementById('tour-back-btn').style.display = (stationId === 0) ? 'none' : 'block';
    },

    closeInternalPage: function() { 
        document.getElementById('tour-modal').classList.remove('visible'); 
        document.getElementById('tour-back-btn').style.display = 'none'; 
        document.getElementById('tour-iframe').src = ""; 
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].start();
    },

    nav: function(page) {
        document.querySelectorAll('.overlay-screen').forEach(p => p.classList.add('hidden'));
        document.getElementById(page + '-page').classList.remove('hidden');
        document.getElementById('main-nav').style.transform = "translateY(0)";
        document.getElementById('ar-top-layer').style.opacity = "0";
        document.getElementById('ar-reticle').style.opacity = "0";
        document.getElementById('gallery-dock-container').classList.remove('ar-active');
    },

    startHeroSlider: function() { 
        setInterval(() => { 
            const banners = document.querySelectorAll('.promo-banner'); 
            banners[this.currentHero].classList.remove('active'); 
            this.currentHero = (this.currentHero + 1) % banners.length; 
            banners[this.currentHero].classList.add('active'); 
        }, 4000); 
    },

    resetApp: function() { window.location.reload(); }
};

window.onload = () => app.init();
</script>
</body>
</html>
