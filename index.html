<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAGVIEW | AR Eco-Tourism</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        @font-face { font-family: 'Agrandir'; src: url('./Assets/agrandir-thin.woff2') format('woff2'); font-weight: 100; font-style: normal; }
        @font-face { font-family: 'Agrandir'; src: url('./Assets/agrandir-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
        
        :root { 
            --accent: #00A699; 
            --accent-soft: rgba(0, 166, 153, 0.2);
            --bg-page: #ffffff; 
            --transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            --safe-bottom: env(safe-area-inset-bottom, 0px); 
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Agrandir', sans-serif !important; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* --- AR UI ELEMENTS --- */
        #ar-reticle { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 75vw; height: 40vh; z-index: 4000; pointer-events: none; opacity: 0; transition: 0.5s var(--transition); }
        .leaf-corner { position: absolute; width: 50px; height: 50px; border: 4px solid var(--accent); }
        .top-left { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 25px 0 0 0; }
        .top-right { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 25px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 25px; }
        .bottom-right { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 25px 0; }
        .laser-line { position: absolute; width: 100%; height: 2px; background: linear-gradient(to right, transparent, var(--accent), transparent); box-shadow: 0 0 15px var(--accent); top: 0; animation: scanMove 3s linear infinite; }
        @keyframes scanMove { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #ar-top-layer { position: fixed; top: 50px; left: 20px; right: 20px; z-index: 4500; display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; pointer-events: none; transition: 0.3s; opacity: 0; }
        .ar-home-btn { pointer-events: auto; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 1px solid rgba(255,255,255,0.2); }
        .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 50px; color: white; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); }
        .status-badge.match-found { background: var(--accent); border-color: var(--accent); }

        /* --- GALLERY DOCK --- */
        #gallery-dock-container { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4600; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); border-top-left-radius: 30px; border-top-right-radius: 30px; transform: translateY(100%); transition: transform 0.6s var(--transition); padding-bottom: var(--safe-bottom); }
        #gallery-dock-container.ar-active { transform: translateY(0); }
        .dock-handle-area { width: 100%; padding: 15px 0; display: flex; justify-content: center; }
        .dock-handle { width: 40px; height: 4px; background: #ddd; border-radius: 10px; }
        #gallery-dock { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 20px; scrollbar-width: none; }
        #gallery-dock::-webkit-scrollbar { display: none; }
        .gallery-item { flex: 0 0 85px; text-align: center; }
        .gallery-img-wrap { width: 85px; height: 85px; border-radius: 18px; overflow: hidden; border: 2px solid transparent; transition: 0.3s; margin-bottom: 6px; }
        .gallery-item.selected .gallery-img-wrap { border-color: var(--accent); transform: scale(1.05); }
        .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-item span { font-size: 9px; font-weight: 800; text-transform: uppercase; color: #666; }

        /* --- PAGES --- */
        .overlay-screen { position: fixed; inset: 0; z-index: 1000; background: #fff; transition: 0.4s; overflow-y: auto; padding-bottom: 120px; }
        .hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(10px); }
        .user-greeting { padding: 50px 25px 10px; }
        .user-greeting h3 { margin: 0; font-size: 12px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .user-greeting h2 { margin: 5px 0 0; font-size: 28px; font-weight: 900; color: #1a1a1a; }

        /* --- HERO SLIDER --- */
        .hero-slider-container { margin: 20px 20px; height: 200px; border-radius: 25px; position: relative; overflow: hidden; }
        .promo-banner { position: absolute; inset: 0; padding: 30px; display: flex; flex-direction: column; justify-content: center; opacity: 0; transition: 0.8s ease; }
        .promo-banner.active { opacity: 1; }
        .promo-banner h1 { color: white; margin: 0; font-size: 22px; font-weight: 900; line-height: 1.2; max-width: 70%; }
        .promo-banner button { background: white; color: #222; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 900; margin-top: 20px; width: fit-content; font-size: 11px; text-transform: uppercase; }

        /* --- NAVIGATION --- */
        .main-navigation-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(85px + var(--safe-bottom)); background: #fff; z-index: 5000; display: flex; justify-content: space-around; align-items: center; padding: 0 10px var(--safe-bottom); box-shadow: 0 -10px 40px rgba(0,0,0,0.05); }
        .nav-item { color: #bbb; padding: 15px; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        .nav-item-center { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -40px; border: 5px solid #fff; box-shadow: 0 10px 20px rgba(0,166,153,0.3); }

        /* --- MODAL --- */
        #tour-modal { position: fixed; inset: 0; z-index: 9000; background: white; transform: translateY(100%); transition: 0.5s var(--transition); }
        #tour-modal.visible { transform: translateY(0); }
        .modal-header { height: 75px; display: flex; align-items: center; justify-content: space-between; padding: 25px 20px 0; border-bottom: 1px solid #f0f0f0; }
        .modal-header h4 { margin: 0; font-size: 14px; text-transform: uppercase; font-weight: 900; color: #222; }
        .close-btn { background: #f5f5f5; border: none; padding: 8px 20px; border-radius: 50px; font-weight: 900; font-size: 11px; color: #666; }

        /* NEW: Fullscreen Map Adjustments */
        #tour-modal.hide-header .modal-header { display: none; }
        #tour-modal.hide-header #tour-iframe { height: 100% !important; }
        #floating-close-btn { 
            position: fixed; top: 20px; right: 20px; z-index: 9999; 
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); 
            color: white; border: 1px solid rgba(255,255,255,0.2); 
            width: 40px; height: 40px; border-radius: 50%; 
            display: none; align-items: center; justify-content: center; 
        }
        #tour-modal.hide-header #floating-close-btn { display: flex; }

        a-scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    </style>
</head>
<body>
    <audio id="match-sound" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb630cc098.mp3" preload="auto"></audio>

    <div id="splash-screen" style="position:fixed; inset:0; z-index:9999; background:#00A699; display:flex; align-items:center; justify-content:center; transition:0.6s;">
        <img src="Assets/Logo_Icon.png" width="80" style="filter:brightness(0) invert(1);">
    </div>

    <div id="ar-reticle">
        <div class="leaf-corner top-left"></div>
        <div class="leaf-corner top-right"></div>
        <div class="leaf-corner bottom-left"></div>
        <div class="leaf-corner bottom-right"></div>
        <div class="laser-line"></div>
    </div>
    
    <div id="ar-top-layer">
        <div class="ar-home-btn" onclick="app.nav('home')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </div>
        <div class="status-badge" id="ar-status-badge">
            <span id="status-text">Scanning Area</span>
        </div>
    </div>

    <div id="gallery-dock-container">
        <div class="dock-handle-area"><div class="dock-handle"></div></div>
        <div id="gallery-dock"></div>
    </div>

    <div id="home-page" class="overlay-screen">
        <div class="user-greeting"><h3>Welcome Explorer</h3><h2>Baguio City</h2></div>
        
        <div class="hero-slider-container">
            <div class="promo-banner active" style="background: linear-gradient(135deg, #00A699, #007a71)">
                <h1>Discover the Hidden Eco-Trails</h1>
                <button onclick="app.startScanner()">Start Scanning</button>
            </div>
            <div class="promo-banner" style="background: linear-gradient(135deg, #222, #444)">
                <h1>Unlock Virtual Heritage Tours</h1>
                <button onclick="app.startScanner()">Find Marker</button>
            </div>
        </div>

        <div style="padding: 10px 25px;"><h4 style="font-weight: 900; font-size: 16px;">Nearby Stations</h4></div>
        <div id="most-scanned-list" style="display:flex; gap:15px; overflow-x:auto; padding:0 25px 30px; scrollbar-width:none;"></div>
    </div>

    <nav class="main-navigation-bar" id="main-nav">
        <div class="nav-item active" onclick="app.nav('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
        <div class="nav-item-center" onclick="app.startScanner()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="9" y="9" width="6" height="6"></rect></svg>
        </div>
        <div class="nav-item" onclick="app.resetApp()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></div>
    </nav>

    <div id="tour-modal">
        <div id="floating-close-btn" onclick="app.closeInternalPage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </div>
        <div class="modal-header">
            <h4 id="modal-title">Station Tour</h4>
            <button class="close-btn" onclick="app.closeInternalPage()">CLOSE</button>
        </div>
        <iframe id="tour-iframe" style="width:100%; height:calc(100% - 75px); border:none;"></iframe>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" embedded vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target-container"></a-entity>
    </a-scene>

<script>
const app = {
    currentHero: 0, 
    stations: [
        { id: 0, name: "Interactive Map", thumb: "Assets/A1_Map.jpg", link: "https://jmflorencio.github.io/Interactive_Map/", scans: 1240 },
        { id: 1, name: "Main Entrance", thumb: "Assets/A2_Main Entrance.png", link: "https://tour.panoee.net/mainentrance/1", scans: 980 },
        { id: 11, name: "Japanese Garden", thumb: "Assets/Japanese%20Garden.png", link: "https://tour.panoee.net/japanese-garden", scans: 760 },
        { id: 12, name: "Japanese Tunnel", thumb: "Assets/Japanese%20Tunnel.png", link: "https://tour.panoee.net/japanese-tunnel/1", scans: 1120 }
    ],

    init: function() {
        this.renderMostScanned(); 
        this.renderDock(); 
        this.initAR(); 
        this.startHeroSlider();
        setTimeout(() => { 
            const splash = document.getElementById('splash-screen');
            if(splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display='none', 600); }
        }, 1500);
    },

    renderMostScanned: function() {
        const list = document.getElementById('most-scanned-list');
        list.innerHTML = this.stations.map(s => `
            <div style="flex:0 0 160px; background:white; border-radius:20px; padding:10px; box-shadow:var(--card-shadow);">
                <img src="${s.thumb}" style="width:100%; height:100px; border-radius:15px; object-fit:cover;">
                <b style="font-size:12px; display:block; margin-top:8px; color:#333;">${s.name}</b>
            </div>
        `).join('');
    },

    renderDock: function() {
        const dock = document.getElementById('gallery-dock');
        dock.innerHTML = this.stations.map(s => `
            <div class="gallery-item" data-station-id="${s.id}">
                <div class="gallery-img-wrap"><img src="${s.thumb}"></div>
                <span>${s.name}</span>
            </div>
        `).join('');
    },

    startScanner: function() {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('main-nav').style.transform = "translateY(150%)";
        document.getElementById('ar-top-layer').style.opacity = "1";
        document.getElementById('ar-reticle').style.opacity = "1";
        document.getElementById('gallery-dock-container').classList.add('ar-active');
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].start();
    },

    nav: function(page) {
        document.getElementById('home-page').classList.remove('hidden');
        document.getElementById('main-nav').style.transform = "translateY(0)";
        document.getElementById('ar-top-layer').style.opacity = "0";
        document.getElementById('ar-reticle').style.opacity = "0";
        document.getElementById('gallery-dock-container').classList.remove('ar-active');
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.systems['mindar-image-system']) sceneEl.systems['mindar-image-system'].stop();
    },

    initAR: function() {
        const container = document.getElementById('target-container');
        const matchSound = document.getElementById('match-sound');
        this.stations.forEach(s => {
            const entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', `targetIndex: ${s.id}`);
            entity.addEventListener("targetFound", () => {
                matchSound.play();
                document.getElementById('ar-status-badge').classList.add('match-found');
                document.getElementById('status-text').innerText = "Match Found!";
                document.querySelectorAll('.gallery-item').forEach(i => i.classList.remove('selected'));
                const item = document.querySelector(`.gallery-item[data-station-id="${s.id}"]`);
                if (item) {
                    item.classList.add('selected');
                    item.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                }
                setTimeout(() => this.openInternalPage(s.link, s.name), 1200);
            });
            entity.addEventListener("targetLost", () => {
                document.getElementById('ar-status-badge').classList.remove('match-found');
                document.getElementById('status-text').innerText = "Scanning Area";
            });
            container.appendChild(entity);
        });
    },

    openInternalPage: function(url, title) { 
        const modal = document.getElementById('tour-modal');
        
        // Logic to hide header for the Interactive Map
        if (title === "Interactive Map") {
            modal.classList.add('hide-header');
        } else {
            modal.classList.remove('hide-header');
        }

        document.getElementById('modal-title').innerText = title;
        document.getElementById('tour-iframe').src = url; 
        modal.classList.add('visible'); 
    },

    closeInternalPage: function() { 
        const modal = document.getElementById('tour-modal');
        modal.classList.remove('visible'); 
        setTimeout(() => { 
            document.getElementById('tour-iframe').src = ""; 
            modal.classList.remove('hide-header');
        }, 500);
    },

    startHeroSlider: function() { 
        setInterval(() => { 
            const banners = document.querySelectorAll('.promo-banner');
            banners[this.currentHero].classList.remove('active');
            this.currentHero = (this.currentHero + 1) % banners.length; 
            banners[this.currentHero].classList.add('active');
        }, 5000); 
    },

    resetApp: function() { window.location.reload(); }
};

window.onload = () => app.init();
</script>
</body>
</html>
