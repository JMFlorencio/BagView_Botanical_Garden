<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BagView Map | Premium Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style> 
        @font-face {
            font-family: 'Agrandir';
            src: url('Assets/Agrandir-Regular.woff2') format('woff2');
            font-weight: normal; font-style: normal;
        }

        :root { 
            --brand: #48E5C2; 
            --dark: #1a1a1a; 
            --font-main: 'Agrandir', 'Inter', sans-serif;
            --color-restroom: #FF6B6B;
            --color-decks: #FFD966;
            --color-facilities: #48E5C2;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: var(--font-main); 
            overflow: hidden; background: #d1d5db; 
        }
        
        #map { height: 100vh; width: 100vw; z-index: 1; background: #d1d5db; }

        .leaflet-top.leaflet-right { top: 20px !important; right: 15px !important; }
        .leaflet-bar { border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important; }
        .leaflet-bar a { background-color: rgba(255,255,255,0.95) !important; color: var(--dark) !important; border-bottom: 1px solid #eee !important; }

        .map-legend {
            position: fixed; top: 25px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
            padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4);
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        .legend-item { display: flex; align-items: center; gap: 12px; }
        .legend-color { width: 32px; height: 14px; border-radius: 5px; }
        .legend-text { font-size: 10px; font-weight: 800; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }

        #premium-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .premium-card {
            background: white; width: 85%; max-width: 350px;
            border-radius: 24px; padding: 30px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .premium-icon { width: 60px; height: 60px; background: #fff8e1; color: #ffa000; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px; }
        .premium-card h2 { margin: 0 0 10px; font-size: 20px; color: var(--dark); font-weight: 900; }
        .premium-card p { margin: 0 0 25px; font-size: 14px; color: #666; line-height: 1.5; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-subscribe { background: #00A699; color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .btn-trial { background: #f3f4f6; color: #4b5563; border: none; padding: 12px; border-radius: 14px; font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase; }

        #pano-overlay-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; display: none; background: #000; }
        .pano-top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 2001; border-bottom: 2px solid #00A699; }
        .pano-title { color: white; font-weight: 800; font-size: 16px; }
        .exit-pill-btn { background: #00A699; color: white; border: none; padding: 10px 22px; border-radius: 50px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; }
        #pano-frame { position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px); border: none; z-index: 2000; }

        #bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
            background: white; z-index: 500; border-radius: 24px 24px 0 0;
            padding: 0 20px 20px; transition: height 0.3s ease-out;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            touch-action: none; overflow: hidden;
        }
        .drag-handle { width: 40px; height: 5px; background: #e5e7eb; margin: 12px auto; border-radius: 10px; cursor: grab; flex-shrink: 0; }
        .sheet-label { font-size: 11px; font-weight: 900; color: var(--dark); text-transform: uppercase; margin-bottom: 15px; }
        #station-list { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px; scrollbar-width: none; opacity: 0; transition: opacity 0.3s ease; }
        #bottom-sheet.open #station-list { opacity: 1; }

        .station-card { flex: 0 0 160px; position: relative; height: 110px; cursor: pointer; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .station-card img { width: 100%; height: 100%; object-fit: cover; }

        .station-tag {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(90deg, rgba(72, 229, 194, 0.85) 0%, rgba(72, 229, 194, 0.7) 50%, rgba(72, 229, 194, 0) 95%);
            backdrop-filter: blur(2px); padding: 10px 15px; pointer-events: none;
        }
        .station-tag span {
            color: white; font-size: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.4px;
            display: block; text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .brand-pin-wrapper { position: relative; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; }
        .brand-pin { width: 24px; height: 24px; background: #00A699; border: 2.5px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 4px 8px rgba(0,0,0,0.3); position: absolute; }
        .pin-number { position: relative; z-index: 2; color: white; font-size: 11px; font-weight: 900; transform: translateY(-2px); }
        .popup-btn { background: #00A699; color: white; border: none; padding: 10px 18px; margin-top: 10px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-legend">
        <div class="legend-item"><div class="legend-color" style="background: var(--color-restroom);"></div><span class="legend-text">Public Restroom</span></div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-decks);"></div><span class="legend-text">View Decks</span></div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-facilities);"></div><span class="legend-text">Park/Facilities</span></div>
    </div>

    <div id="premium-modal-overlay">
        <div class="premium-card">
            <div class="premium-icon">✨</div>
            <h2>Premium Feature</h2>
            <p>Unlock high-definition 360° virtual tours and exclusive resort features.</p>
            <div class="modal-btns">
                <button class="btn-subscribe" onclick="alert('Redirecting...')">Get Premium Access</button>
                <button class="btn-trial" id="modal-trial-btn">Free Trial 7 Days</button>
            </div>
        </div>
    </div>

    <div id="pano-overlay-container">
        <div class="pano-top-bar"><span class="pano-title">Baguio Botanical Garden</span><button class="exit-pill-btn" id="header-exit-btn">Back to Map</button></div>
        <iframe id="pano-frame" src="" allow="accelerometer; gyroscope; xr-spatial-tracking; fullscreen" allowfullscreen></iframe>
    </div>

    <div id="bottom-sheet">
        <div class="drag-handle" id="sheet-handle"></div>
        <div class="sheet-label">Botanical Garden Stations</div>
        <div id="station-list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const stations = [
            { id: 1, y: 700, x: 125, name: 'Main Entrance', img: 'Assets/A2_Main Entrance.png', pano: 'https://tour.panoee.net/mainentrance/1' },
            { id: 2, y: 590, x: 135, name: 'Centennial Garden', img: 'Assets/Centennial Garden.png', pano: 'https://tour.panoee.net/centennial-garden/1' },
            { id: 3, y: 585, x: 565, name: 'Orchidarium', img: 'Assets/Orchidarium.png', pano: 'https://tour.panoee.net/orchidarium/1' },
            { id: 4, y: 885, x: 775, name: 'PMSEA Garden', img: 'Assets/PMSEA%20Garden.png', pano: 'https://tour.panoee.net/pmsea-garden' },
            { id: 5, y: 795, x: 955, name: 'Japanese Tunnel', img: 'Assets/Japanese%20Garden.png', pano: 'https://tour.panoee.net/japanese-tunnel/1' },
            { id: 6, y: 735, x: 875, name: 'Japanese Garden', img: 'Assets/Japanese%20Tunnel.png', pano: 'https://tour.panoee.net/japanese-garden' },
            { id: 7, y: 645, x: 805, name: 'Korea Garden', img: 'Assets/Korea%20Garden.png', pano: 'https://tour.panoee.net/korea-garden/1' },
            { id: 8, y: 495, x: 675, name: 'Chinese Garden', img: 'Assets/Chinese Garden.png', pano: 'https://tour.panoee.net/chinese-garden/69cd28ffcd728200084a2654' },
            { id: 9, y: 365, x: 610, name: 'Asian Garden', img: 'Assets/Asian Garden.png', pano: 'https://tour.panoee.net/asian-garden' },
            { id: 10, y: 445, x: 480, name: 'Arbor', img: 'Assets/Arbor.png', pano: 'https://tour.panoee.net/arbor' },
            { id: 11, y: 385, x: 740, name: 'City of Vaughan', img: 'Assets/City of Vaughan Friendship Garden.png', pano: 'https://tour.panoee.net/city-of-vaughan' },
            { id: 12, y: 295, x: 785, name: 'Philippine-Thailand Friendship Garden', img: 'Assets/Philippine-Thailand Friendship Garden.png', pano: 'https://tour.panoee.net/philippine-thailand-friendship-garden/7-1' },
            { id: 13, y: 155, x: 475, name: 'Cactus & Succulents', img: 'Assets/Cactus&Succulents.png', pano: 'https://tour.panoee.net/cactus-succulent-garden/1-1' },
            { id: 14, y: 280, x: 325, name: 'Cordillera Village', img: 'Assets/Cordillera%20Village.png', pano: 'https://tour.panoee.net/cordillera-village/1' },
            { id: 15, y: 335, x: 270, name: 'Green House', img: 'Assets/Greenhouse.png', pano: 'https://tour.panoee.net/greenhouse/1' }
        ];

        const bounds = [[0, 0], [1000, 1000]];
        const map = L.map('map', { 
            crs: L.CRS.Simple, 
            zoomControl: true, 
            attributionControl: false,
            maxBounds: bounds,         
            maxBoundsViscosity: 1.0,
            minZoom: -1.2,
            maxZoom: 1, // LIMIT ZOOM SCALE HERE
            zoomSnap: 0.1
        });
        map.zoomControl.setPosition('topright');

        L.imageOverlay('Assets/A1_Map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        const list = document.getElementById('station-list');
        stations.forEach(s => {
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="brand-pin-wrapper"><div class="brand-pin"></div><div class="pin-number">${s.id}</div></div>`,
                iconSize: [30, 30], iconAnchor: [15, 30]
            });

            const marker = L.marker([s.y, s.x], {icon}).addTo(map)
                .bindPopup(`<div style="text-align:center;"><b>${s.name}</b><br><button onclick="triggerPremiumModal('${s.pano}')" class="popup-btn">Enter 360°</button></div>`);
            
            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML = `<img src="${s.img}"><div class="station-tag"><span>${s.id}. ${s.name}</span></div>`;
            card.onclick = () => { marker.openPopup(); map.flyTo([s.y, s.x], 1, { duration: 1.5 }); };
            list.appendChild(card);
        });

        const overlay = document.getElementById('pano-overlay-container');
        const frame = document.getElementById('pano-frame');
        const sheet = document.getElementById('bottom-sheet');
        const handle = document.getElementById('sheet-handle');
        const premiumModal = document.getElementById('premium-modal-overlay');
        const trialBtn = document.getElementById('modal-trial-btn');
        let pendingPanoUrl = "";

        function triggerPremiumModal(url) { pendingPanoUrl = url; premiumModal.style.display = 'flex'; }
        trialBtn.onclick = () => { premiumModal.style.display = 'none'; openPano(pendingPanoUrl); };
        function openPano(url) { frame.src = url; overlay.style.display = 'block'; }
        document.getElementById('header-exit-btn').onclick = () => { overlay.style.display = 'none'; frame.src = ""; };

        let startY, startHeight;
        const minHeight = 50;
        const maxHeight = 260;

        const setSheetHeight = (height) => {
            sheet.style.height = height + "px";
            if (height > 100) sheet.classList.add('open');
            else sheet.classList.remove('open');
        };

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            startHeight = sheet.offsetHeight;
            sheet.style.transition = "none";
        });

        handle.addEventListener('touchmove', (e) => {
            const deltaY = startY - e.touches[0].clientY;
            const newHeight = Math.min(maxHeight, Math.max(minHeight, startHeight + deltaY));
            sheet.style.height = newHeight + "px";
        });

        handle.addEventListener('touchend', (e) => {
            sheet.style.transition = "height 0.3s ease-out";
            const currentHeight = sheet.offsetHeight;
            if (currentHeight > 150) {
                setSheetHeight(maxHeight);
            } else {
                setSheetHeight(minHeight);
            }
        });

        handle.onclick = () => {
            sheet.style.transition = "height 0.3s ease-out";
            const isOpen = sheet.classList.contains('open');
            setSheetHeight(isOpen ? minHeight : maxHeight);
        };

        window.onload = () => setTimeout(() => {
            sheet.style.transition = "height 0.3s ease-out";
            setSheetHeight(maxHeight);
        }, 800);
    </script>
</body>
</html>
